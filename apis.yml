aid: seedcamp
name: Seedcamp
description: >-
  Seedcamp is Europe's original first-cheque seed fund, founded in May 2007 and
  headquartered in London, United Kingdom. It backs founders from day one,
  writing first cheques primarily at the pre-seed and seed stages (typically
  between roughly $350,000 and $1 million) and following winners into later
  rounds through its Select fund toward Series B and beyond. Seedcamp is broadly
  sector-agnostic across software and technology, with concentrations in
  artificial intelligence, fintech, healthtech, cybersecurity, open-source,
  enterprise software, and developer tools. In June 2026 the firm announced it
  had raised $320 million — $220 million for Seedcamp VII (its flagship first
  cheque fund) and $100 million for the Select fund — pushing assets under
  management past $1 billion. The "Seedcamp Nation" now spans 500-plus companies,
  including publicly listed UiPath and Wise and unicorns such as Revolut,
  Synthesia, Sorare, Pleo, wefox, and viz.ai. Seedcamp Investment Management LLP
  is authorised and regulated by the UK Financial Conduct Authority.
